x-servicio-env: &servicio-env
  DB_HOST: host.docker.internal
  DB_PORT: "3306"
  DB_PASS: ""
  EUREKA_URL: http://eureka-server:8761/eureka/
  MS_USUARIOS_URL: http://gestion-usuarios:8080
  MS_DIRECCIONES_URL: http://gestion-direcciones:8081
  MS_CATALOGO_URL: http://gestion-catalogo:8091
  MS_INVENTARIO_URL: http://gestion-inventario:8090
  MS_PEDIDOS_URL: http://gestion-pedidos:8092

services:
  eureka-server:
    build:
      context: ./eurekaserver
      dockerfile: Dockerfile
    container_name: eureka-server
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_HOST: eureka-server
    ports:
      - "8761:8761"
    restart: on-failure
    networks:
      - microservicios-net

  gestion_usuarios:
    build:
      context: ./gestion_usuarios
      dockerfile: Dockerfile
    container_name: gestion_usuarios
    environment: *servicio-env
    volumes:
      - ./logs/gestion_usuarios:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_started
    restart: on-failure
    networks:
      microservicios-net:
        aliases:
          - gestion-usuarios

  gestion_direcciones:
    build:
      context: ./gestion_direcciones
      dockerfile: Dockerfile
    container_name: gestion_direcciones
    environment: *servicio-env
