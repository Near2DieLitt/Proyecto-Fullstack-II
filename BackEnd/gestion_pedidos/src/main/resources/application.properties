spring.application.name=gestion-pedidos

server.port=8092

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_pedidos
spring.datasource.username=root
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=gestion-pedidos
eureka.instance.instance-id=gestion-pedidos:${server.port}

ms.usuarios.url=${MS_USUARIOS_URL:http://localhost:8080}
ms.direcciones.url=${MS_DIRECCIONES_URL:http://localhost:8081}
ms.catalogo.url=${MS_CATALOGO_URL:http://localhost:8091}
ms.inventario.url=${MS_INVENTARIO_URL:http://localhost:8090}


tienda.costo-envio=3990
tienda.envio-gratis-desde=100000

logging.file.name=logs/${spring.application.name}.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
