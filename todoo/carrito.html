<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Sonido Vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="sonido-vivo.css">
</head>
<body class="bg-cream">

    <header class="sticky-top bg-white z-3 border-bottom">
        <div class="top-banner text-white text-center py-2">🚚 Despacho a todo Chile · Lunes a Sábado 10:00 - 19:00 hrs</div>
        <nav class="navbar navbar-expand-lg py-3 px-4 px-lg-5">
            <a class="navbar-brand logo text-dark" href="sonido-vivo.html"><strong>SONIDO</strong> vivo</a>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav gap-lg-4">
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="sonido-vivo.html">INICIO</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="catalogo.html">CATÁLOGO</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="#">NOVEDADES</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="nuestra-tienda.html">SOBRE NOSOTROS</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="inicio-sesion.html">MI PERFIL</a></li>
                </ul>
            </div>
             <div class="d-none d-lg-flex gap-4 align-items-center">
                <a href="inicio-sesion.html" class="custom-nav-link text-decoration-none"><i class="fa fa-user me-1"></i> INGRESAR</a>
                <a href="carrito.html" class="custom-nav-link text-decoration-none text-dark fw-bold"><i class="fa fa-shopping-cart me-1"></i> CARRITO <span id="cart-count" class="badge bg-dark ms-1">0</span></a>
            </div>
        </nav>
    </header>

    <main class="container py-5 my-4 min-vh-100">
        <h1 class="playfair-font fw-bold mb-5">Mi carrito de compras</h1>

        <div class="row g-5">
            <!-- Lista de productos -->
            <div class="col-12 col-lg-8" id="contenedorCarrito">
    
            </div>

            <!-- Resumen de compra -->
            <div class="col-12 col-lg-4">
                <div class="bg-white p-4 border rounded">
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                        <h4 class="fw-bold mb-0">TOTAL:</h4>
                        <h3 class="fw-bold mb-0 text-dark" id="carritoTotal">$0</h3>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fs-7 text-muted">Ingrese su cupón de descuento</label>
                        <div class="d-flex gap-2">
                            <input type="text" class="form-control rounded-0" placeholder="Ej: SONIDO20">
                            <button class="btn btn-outline-secondary rounded-0">APLICAR</button>
                        </div>
                    </div>

                    <button class="btn btn-success w-100 rounded-0 py-3 fw-bold fs-6" onclick="pagar()">PAGAR</button>
                    <button class="btn btn-outline-danger w-100 rounded-0 py-2 mt-2 fs-7 fw-bold" onclick="vaciarCarrito()">VACIAR CARRITO</button>
                </div>
            </div>
        </div>
    </main>

    <script src="carrito.js"></script>
</body>
</html>
