</head>
<body class="bg-cream">
    <header class="sticky-top bg-white z-3 border-bottom">
        <div class="top-banner text-white text-center py-2">
            🚚 Despacho a todo Chile · Retiro gratis en Viña del Mar · Lunes a Sábado 10:00 - 19:00 hrs

                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">

</head>

  <section class="container min-vh-100 d-flex justify-content-center align-items-center py-5">
    <div class="auth-card shadow-sm">
      <div class="auth-header-bar">
        <ul class="nav nav-justified" id="authTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">
              INICIAR SESIÓN
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">
              REGISTRARSE
            </button>
          </li>
        </ul>
      </div>


      <div class="p-4 p-md-5">
        <div class="tab-content" id="authTabsContent">

          <div class="tab-pane fade" id="login" role="tabpanel">
            <form>
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="nombre@ejemplo.com" required>
              </div>
              <div class="mb-4">
                <label for="loginPassword" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="loginPassword" required>
              </div>
              <button type="submit" class="btn btn-custom-dark w-100">Iniciar Sesión</button>
            </form>
          </div>

          <div class="tab-pane fade show active" id="register" role="tabpanel">
            <form class="row g-3">
              <div class="col-md-6">
                <label for="inputEmail" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="inputEmail" required>
              </div>
              <div class="col-md-6">
                <label for="inputPassword" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="inputPassword" required>
              </div>
              <div class="col-12">
                <label for="inputAddress" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="inputAddress" placeholder="Calle Principal 1234">
              </div>
              <div class="col-12">
                <label for="inputAddress2" class="form-label">Dirección 2</label>
                <input type="text" class="form-control" id="inputAddress2" placeholder="Apartamento, estudio o piso">
              </div>
              <div class="col-md-7">
                <label for="inputCity" class="form-label">Ciudad</label>
                <input type="text" class="form-control" id="inputCity">
              </div>
              <div class="col-md-5">
                <label for="inputState" class="form-label">Estado / Región</label>
                <select id="inputState" class="form-select">
                  <option selected disabled>Elegir...</option>
                  <option>...</option>
                </select>
              </div>
              <div class="col-12">
                <div class="form-check mt-2">
                  <input class="form-check-input" type="checkbox" id="gridCheck">
                  <label class="form-check-label fs-7" for="gridCheck">
                    Recuérdame
                  </label>
                </div>
              </div>
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-custom-dark w-100">Registrarse</button>
              </div>
            </form>
          </div>

        </div>
      </div>

    </div>
  </section>

</body>
</html>
    <script src="inicio-sesion.js"></script>
