<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Productos - Sonido Vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="sonido-vivo.css">
    <link rel="stylesheet" href="registro.css">
</head>
<body class="bg-cream">
    
    <header class="sticky-top bg-white z-3 border-bottom">
        <nav class="navbar navbar-expand-lg py-3 px-4 px-lg-5">
            <a class="navbar-brand logo text-dark" href="#"><strong>SONIDO</strong> vivo <span class="fs-6 text-muted">ADMIN</span></a>
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav gap-lg-4">
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="#">PRODUCTOS</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="#">USUARIOS</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link text-danger" href="inicio-sesion.html">SALIR</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container py-5 min-vh-100">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="playfair-font fw-bold">Mantenedor de Productos</h1>
            <button class="btn btn-custom-dark" data-bs-toggle="modal" data-bs-target="#modalProducto" onclick="prepararCrear()">+ NUEVO PRODUCTO</button>
        </div>

        <div class="bg-white p-4 border rounded shadow-sm overflow-auto">
            <table class="table align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Código</th>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos">
                    </tbody>
            </table>
        </div>
    </main>

    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content auth-card">
                <div class="modal-header auth-header-bar text-white">
                    <h5 class="modal-title" id="modalTitle">Nuevo Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formProducto">
                        <input type="hidden" id="prodIndex"> <div class="mb-3">
                            <label class="form-label">Código producto *</label>
                            <input type="text" class="form-control" id="prodCodigo" required minlength="3">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="prodNombre" required maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Precio *</label>
                            <input type="number" class="form-control" id="prodPrecio" required min="0"> 
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Stock *</label>
                                <input type="number" class="form-control" id="prodStock" required min="0">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Stock Crítico</label>
                                <input type="number" class="form-control" id="prodStockCritico" min="0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría *</label>
                            <select class="form-select" id="prodCategoria" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option value="Guitarras">Guitarras</option>
                                <option value="Bajos">Bajos</option>
                                <option value="Baterías">Baterías</option>
                                <option value="Teclados">Teclados</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="prodDesc" maxlength="500"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">URL de Imagen</label>
                            <input type="url" class="form-control" id="prodImg">
                        </div>
                        <button type="submit" class="btn btn-custom-dark w-100">Guardar Producto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin-productos.js"></script>
</body>
</html>
