<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonido Vivo - Registrarse</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="sonido-vivo.css">
    <link rel="stylesheet" href="registro.css">
</head>
<body class="bg-cream">
    <header class="sticky-top bg-white z-3 border-bottom">
        <div class="top-banner text-white text-center py-2">
            🚚 Despacho a todo Chile · Retiro gratis en Viña del Mar · Lunes a Sábado 10:00 - 19:00 hrs
        </div>
        <nav class="navbar navbar-expand-lg py-3 px-4 px-lg-5">
            <a class="navbar-brand logo text-dark" href="sonido-vivo.html"><strong>SONIDO</strong> vivo</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav gap-lg-4">
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="sonido-vivo.html">INICIO</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="catalogo.html">CATÁLOGO</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="novedades.html">NOVEDADES</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="sobre-nosotros.html">SOBRE NOSOTROS</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="mi-perfil.html">MI PERFIL</a></li>
                </ul>
            </div>
            <div class="d-none d-lg-flex gap-4 align-items-center">
                <a href="inicio-sesion.html" class="custom-nav-link text-decoration-none"><i class="fa fa-user me-1"></i> INGRESAR</a>
                <a href="#" class="custom-nav-link text-decoration-none"><i class="fa fa-shopping-cart me-1"></i> CARRITO</a>
            </div>
        </nav>
    </header>
    <div class="login caja-registro">
        
        <h1 id="logo-centro">SONIDO <span>vivo</span></h1>

        <div class="pestanas">
            <button onclick="window.location.href='inicio-sesion.html'">INICIAR SESIÓN</button>
            <button class="activa">REGISTRARSE</button>
        </div>

        <div class="grupo-input">
            <label>RUN *</label>
            <input type="text" id="Run" placeholder="Sin puntos ni guion, ej: 12345678K">
        </div>

        <div class="fila-doble">
            <div class="grupo-input">
                <label>NOMBRE *</label>
                <input type="text" id="Nombre" placeholder="Tu nombre" maxlength="50">
                <span class="contador">0/50</span>
            </div>
            <div class="grupo-input">
                <label>APELLIDOS *</label>
                <input type="text" id="Apellidos" placeholder="Apellidos" maxlength="100">
                <span class="contador">0/100</span>
            </div>
        </div>

        <div class="grupo-input">
            <label>CORREO ELECTRÓNICO *</label>
            <input type="email" id="CorreoReg" placeholder="nombre@ejemplo.com">
        </div>

        <div class="fila-doble">
            <div class="grupo-input">
                <label>CONTRASEÑA *</label>
                <input type="password" id="ClaveReg" placeholder="4 a 10 caracteres" maxlength="10">
            </div>
            <div class="grupo-input">
                <label>CONFIRMAR *</label>
                <input type="password" id="ClaveConf" placeholder="Repite" maxlength="10">
            </div>
        </div>

        <!-- Fila 3: Fecha y Tipo -->
        <div class="fila-doble">
            <div class="grupo-input">
                <label>FECHA DE NACIMIENTO</label>
                <input type="date" id="FechaNac">
            </div>
            <div class="grupo-input">
                <label>TIPO DE USUARIO <span>*</span></label>
                <select id="TipoUsuario">
                    <option value="" disabled selected>Seleccionar...</option>
                    <option value="cliente">Cliente</option>
                    <option value="vendedor">Vendedor</option>
                </select>
            </div>
        </div> <!-- Cierre crucial de la fila 3 -->

        <!-- Fila 4: Región y Comuna -->
        <div class="fila-doble">
            <div class="grupo-input">
                <label>REGIÓN <span>*</span></label>
                <select id="Region">
                    <option value="" disabled selected>Seleccionar región...</option>
                    <option value="Arica y Parinacota">Arica y Parinacota</option>
                    <option value="Tarapacá">Tarapacá</option>
                    <option value="Antofagasta">Antofagasta</option>
                    <option value="Atacama">Atacama</option>
                    <option value="Coquimbo">Coquimbo</option>
                    <option value="Valparaíso">Valparaíso</option>
                    <option value="Metropolitana">Metropolitana de Santiago</option>
                    <option value="O'Higgins">Libertador General Bernardo O'Higgins</option>
                    <option value="Maule">Maule</option>
                    <option value="Ñuble">Ñuble</option>
                    <option value="Biobío">Biobío</option>
                    <option value="La Araucanía">La Araucanía</option>
                    <option value="Los Ríos">Los Ríos</option>
                    <option value="Los Lagos">Los Lagos</option>
                    <option value="Aysén">Aysén del General Carlos Ibáñez del Campo</option>
                    <option value="Magallanes">Magallanes y de la Antártica Chilena</option>
                </select>
            </div>
            <div class="grupo-input">
                <label>COMUNA <span>*</span></label>
                <select id="Comuna">
                    <option value="" disabled selected>Seleccionar comuna...</option>
                    <option value="vina">Viña del Mar</option>
                    <option value="santiago">Santiago</option>
                </select>
            </div>
        </div> <!-- Cierre crucial de la fila 4 -->

        <!-- Fila 5: Dirección -->
        <div class="grupo-input">
            <label>DIRECCIÓN <span>*</span></label>
            <input type="text" id="Direccion" placeholder="Calle, número, depto." maxlength="300">
            <span class="contador">0/300</span>
        </div>

        <!-- Botón -->
        <button onclick="registrar()" class="btn-submit">CREAR CUENTA</button>


    </div>

    <script src="registrarse.js"></script>
</body>
</html>
